services:
  minecraft:
    image: itzg/minecraft-server:latest
    container_name: minecraft
    restart: unless-stopped
    # Docker's default 10s would SIGKILL a slow world save;
    # Matches the image's own 60s STOP_DURATION
    stop_grace_period: 1m
    stdin_open: true
    tty: true
    # For DNS to work properly
    network_mode: host
    ports:
      - "${SERVER_PORT:?set SERVER_PORT in .env}:${SERVER_PORT}"
    env_file: .env
    environment:
      # Accept terms & conditions
      EULA: "TRUE"
    # Image's own check, probed every 5s while starting so `npm start` (compose --wait) returns soon after the server is ready
    # 5m start period covers downloading the server and generating the first world
    healthcheck:
      test: mc-health
      start_period: 5m
      start_interval: 5s
    volumes:
      - ./data:/data
